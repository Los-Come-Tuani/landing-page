<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Descubrí la propuesta de K’plan: circuitos, lugares, eventos y talento local para explorar Nicaragua. Conocé la app y el piloto en preparación."
    />
    <link rel="icon" type="image/svg+xml" href="/src/assets/isotipo-kplan.svg" />
    <meta name="theme-color" content="#F9FBFC" />
    <title>K’plan · La Nicaragua creativa, en tu próximo plan</title>
    <!-- Estilos propios: estos avisos aparecen justamente cuando el CSS y el JS del sitio no cargaron. -->
    <style>
      .boot-message { max-width: 560px; margin: 16vh auto 0; padding: 0 24px; font-family: Poppins, Arial, sans-serif; color: #1a1a1a; line-height: 1.6; }
      .boot-message h1 { margin: 0 0 16px; font-family: 'Inknut Antiqua', Georgia, serif; font-size: 1.75rem; font-weight: 600; line-height: 1.4; }
      .boot-message p { margin: 0 0 12px; color: #666; }
      .boot-message a { color: #b74728; font-weight: 500; }
      .boot-fallback { display: none; }
      #root:empty ~ .boot-fallback { display: block; visibility: hidden; animation: boot-show 0s 10s forwards; }
      @keyframes boot-show { to { visibility: visible; } }
    </style>
    <noscript><style>.boot-fallback { display: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-message boot-fallback">
      <h1>K’plan está tardando en cargar.</h1>
      <p>Puede ser la conexión o una versión nueva del sitio que acabamos de publicar. Recargá la página para intentarlo de nuevo.</p>
      <p><a href="">Recargar la página</a> · <a href="mailto:kplan.nic@gmail.com">Escribinos</a></p>
    </div>
    <noscript>
      <div class="boot-message">
        <h1>Para ver K’plan, activá JavaScript.</h1>
        <p>Este sitio necesita JavaScript para mostrar los recorridos, la app y el formulario de demo. Activalo en la configuración de tu navegador y recargá la página.</p>
        <p>¿Preferís escribirnos? <a href="mailto:kplan.nic@gmail.com">kplan.nic@gmail.com</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
